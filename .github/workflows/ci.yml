name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deploy script
        run: bash -n deploy.sh

      - name: Deployment dry run
        run: npm run deploy:dry-run

      - name: Check forbidden deployment files
        run: |
          test ! -f .clasp.json
          test ! -f .clasprc.json
          test ! -d .deploy

      - name: Search obvious secrets
        run: |
          if grep -RInE \
            '(CLIENT_SECRET|ACCESS_TOKEN|REFRESH_TOKEN|private_key|AIza[0-9A-Za-z_-]{20,})' \
            . \
            --exclude-dir=.git \
            --exclude-dir=node_modules; then
            echo "Potential secret detected."
            exit 1
          fi
