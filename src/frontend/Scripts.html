<script>
/**
 * Scripts.html
 * 全域 JavaScript 與前端框架邏輯
 */

// 全域狀態
var App = {
  currentView: 'home',
  user: {
    email: '',
    name: '',
    role: ''
  }
};

/**
 * 封裝 google.script.run 成為 Promise
 * @param {string} methodName 後端函數名稱
 * @param {any[]} args 函數參數清單
 * @return {Promise}
 */
function callServer(methodName) {
  var args = Array.prototype.slice.call(arguments, 1);
  showLoading(true);
  
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(response) {
        showLoading(false);
        if (response && response.success === true) {
          resolve(response.data);
        } else {
          var errMsg = (response && response.message) ? response.message : '未知錯誤';
          var errDetails = (response && response.details) ? response.details : '';
          showToast(errMsg, 'error');
          reject({ message: errMsg, details: errDetails });
        }
      })
      .withFailureHandler(function(error) {
        showLoading(false);
        showToast(error.message, 'error');
        reject(error);
      })[methodName].apply(google.script.run, args);
  });
}

/**
 * 控制載入畫面顯示
 * @param {boolean} show 是否顯示
 */
function showLoading(show) {
  var overlay = document.getElementById('loadingOverlay');
  if (overlay) {
    if (show) {
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
    }
  }
}

/**
 * 顯示 Toast 訊息提示
 * @param {string} msg 提示訊息
 * @param {string} type 類型 (success, error, warning)
 */
function showToast(msg, type) {
  type = type || 'success';
  var container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  
  var colorMap = {
    success: '#10b981',
    error: '#ef4444',
    warning: '#f59e0b'
  };
  toast.style.borderLeft = '4px solid ' + colorMap[type];

  toast.innerHTML = '<span>' + escapeHtml(msg) + '</span>';
  container.appendChild(toast);

  // 4 秒後自動移除
  setTimeout(function() {
    toast.style.animation = 'slideOut 0.3s ease forwards';
    toast.addEventListener('animationend', function() {
      toast.remove();
    });
  }, 4000);
}

/**
 * 安全跳脫 HTML 字元，防止 XSS
 */
function escapeHtml(str) {
  if (typeof str !== 'string') return str;
  return str.replace(/[&<>"']/g, function(m) {
    switch (m) {
      case '&': return '&amp;';
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '"': return '&quot;';
      case "'": return '&#039;';
      default: return m;
    }
  });
}

/**
 * SPA 切換視圖
 * @param {string} viewId 視圖識別碼
 */
function switchView(viewId) {
  // 檢查選單是否被停用 (非本階段開放)
  var clickedMenu = document.querySelector('[data-view="' + viewId + '"]');
  if (clickedMenu && clickedMenu.classList.contains('disabled')) {
    showToast('該模組於後續階段開放，目前尚未啟用。', 'warning');
    return;
  }

  // 隱藏所有視圖
  var views = document.querySelectorAll('.view-content');
  views.forEach(function(view) {
    view.style.display = 'none';
  });

  // 顯示選定視圖
  var targetView = document.getElementById('view_' + viewId);
  if (targetView) {
    targetView.style.display = 'block';
    App.currentView = viewId;
  }

  // 更新選單 Active 狀態
  var menuItems = document.querySelectorAll('.menu-item');
  menuItems.forEach(function(item) {
    item.classList.remove('active');
    if (item.getAttribute('data-view') === viewId) {
      item.classList.add('active');
    }
  });

  // 觸發各視圖特定的載入邏輯
  if (viewId === 'system_status' && typeof loadSystemStatus === 'function') {
    loadSystemStatus();
  } else if (viewId === 'auth_diagnostic' && typeof loadAuthDiagnostic === 'function') {
    loadAuthDiagnostic();
  } else if (viewId === 'classes' && typeof loadClassesList === 'function') {
    loadClassesList();
  } else if (viewId === 'students' && typeof loadStudentsList === 'function') {
    loadClassesFilter().then(loadStaticCategories).then(loadStudentsList);
  } else if (viewId === 'daily_entry' && typeof initDailyMealEntryView === 'function') {
    initDailyMealEntryView();
  } else if (viewId === 'class_monitor' && typeof initLunchDashboardView === 'function') {
    initLunchDashboardView();
  } else if (viewId === 'calendar' && typeof initCalendarManagementView === 'function') {
    initCalendarManagementView();
  } else if (viewId === 'suspensions' && typeof initMealSuspensionView === 'function') {
    initMealSuspensionView();
  } else if (viewId === 'daily_calc' && typeof initDailyCalcView === 'function') {
    initDailyCalcView();
  } else if (viewId === 'monthly_recon' && typeof initMonthlyReconView === 'function') {
    initMonthlyReconView();
  } else if (viewId === 'daily_ledger' && typeof initDailyLedgerView === 'function') {
    initDailyLedgerView();
  } else if (viewId === 'reports' && typeof initReportCenterView === 'function') {
    initReportCenterView();
  } else if (viewId === 'report-template-management' && typeof initReportTemplateManagementView === 'function') {
    initReportTemplateManagementView();
  } else if (viewId === 'rate-migration' && typeof initRateMigrationView === 'function') {
    initRateMigrationView();
  }
}

// 監聽 Hash 改變以執行前端路由
window.addEventListener('hashchange', handleHashRouting);
window.addEventListener('load', handleHashRouting);

function handleHashRouting() {
  var hash = location.hash || '#home';
  var viewId = hash.substring(1);
  
  // 去除 query string (如 ?id=CLOSE_xxx)
  var qIdx = viewId.indexOf('?');
  if (qIdx !== -1) {
    viewId = viewId.substring(0, qIdx);
  }

  // 映射連字號到下底線
  var elementId = viewId;
  
  // 觸發視圖切換
  switchView(elementId);
}

// -------------------------------------------------------------
// 📄 補助報表與核章核銷中心控制器 (Report Center)
// -------------------------------------------------------------
var activeClosing = null;
var activeReportRun = null;

function initReportCenterView() {
  var monthInput = document.getElementById('repCenterMonth');
  if (monthInput && !monthInput.value) {
    var now = new Date();
    monthInput.value = now.getFullYear() + '-' + Utils.padZero(now.getMonth() + 1);
  }
  loadRepCenterClosingInfo();
}

function loadRepCenterClosingInfo() {
  var month = document.getElementById('repCenterMonth').value;
  if (!month) return;
  
  callServer('apiListClosingHistory').then(function(history) {
    var c = history.filter(function(x) {
      return x.year_month === month && x.is_current === true;
    })[0];
    
    var statusCard = document.getElementById('repClosingStatusCard');
    if (c) {
      activeClosing = c;
      statusCard.style.display = 'block';
      document.getElementById('repClosingTitle').innerText = month + ' 關帳版本 V' + c.closing_version;
      document.getElementById('repClosingStatusBadge').innerText = c.status;
      document.getElementById('repClosingMealsCount').innerText = (c.meal_count_total || 0) + ' 餐';
      document.getElementById('repClosingArtifactStatus').innerText = c.artifact_status || 'N/A';
      
      var html = '';
      if (App.user.role === 'system_admin' && c.status === 'draft') {
        html += '<button class="btn btn-primary" onclick="submitValidateClosing(\'' + c.closing_id + '\')">🛡️ 審定就緒性 (Validate)</button>';
      }
      if (c.status === 'validated') {
        html += '<span style="color: var(--success-color); font-weight: bold; margin-right: 15px;">✓ 已通過就緒性審定</span>';
      }
      
      // 開啟正式報表包
      html += '<button class="btn btn-secondary" onclick="viewOfficialReportPackage(\'' + c.closing_id + '\')">📦 開啟封存包清單</button>';
      document.getElementById('repClosingActionsBlock').innerHTML = html;
      
      loadReportManifest();
    } else {
      activeClosing = null;
      statusCard.style.display = 'none';
      document.getElementById('repManifestBlock').innerHTML = '<p style="color: var(--text-muted);">該月份尚未建立任何月結草稿。</p>';
    }
  });
}

function submitValidateClosing(closingId) {
  callServer('apiValidateClosing', closingId).then(function() {
    showToast('已核可該月結草稿，進入 validated 狀態！', 'success');
    loadRepCenterClosingInfo();
  });
}

function triggerPreview(reportType) {
  if (!activeClosing) {
    showToast('請先選擇一個有效的已月結月份', 'error');
    return;
  }
  
  callServer('apiGenerateReportPreview', activeClosing.closing_id, reportType, '').then(function(res) {
    switchView('report-preview');
    document.getElementById('previewDesc').innerText = '正在預覽：' + reportType + '。正式報表必須在月結 locked 狀態下由管理員簽發。';
    
    var container = document.getElementById('previewFrameContainer');
    container.innerHTML = '<iframe src="' + res.fileUrl + '" style="width:100%; height:100%; border:none;"></iframe>';
    
    var downloadBtn = document.getElementById('previewDownloadBtn');
    downloadBtn.href = res.fileUrl;
    downloadBtn.style.display = 'inline-block';
  });
}

function triggerOfficial(reportType) {
  if (!activeClosing) {
    showToast('請先選擇一個有效的已月結月份', 'error');
    return;
  }
  if (activeClosing.status !== 'closed') {
    showToast('正式報表僅能在已 closed 關帳狀態下產生！', 'error');
    return;
  }
  
  if (!confirm('您確認要正式產生此份正式會計報表 PDF 嗎？這將會寫入正式關帳資料夾，並計算 SHA-256 Checksum。')) {
    return;
  }
  
  callServer('apiGenerateOfficialReport', activeClosing.closing_id, reportType, '').then(function(run) {
    showToast('正式報表產生成功！', 'success');
    loadReportManifest();
  });
}

function loadReportManifest() {
  if (!activeClosing) return;
  
  callServer('apiListReportsByClosing', activeClosing.closing_id).then(function(runs) {
    var block = document.getElementById('repManifestBlock');
    if (runs.length === 0) {
      block.innerHTML = '<p style="color: var(--text-muted);">當月尚未產生任何正式會計報表 PDF。</p>';
      return;
    }
    
    var html = '<div class="table-responsive"><table class="data-table">' +
               '<thead><tr><th>報表類型</th><th>範本版本</th><th>檔案大小 (Bytes)</th><th>SHA-256 雜湊</th><th>下載/預覽</th><th>核章狀態</th></tr></thead><tbody>';
               
    runs.forEach(function(r) {
      var fileLink = r.output_file_url ? '<a href="' + r.output_file_url + '" target="_blank" class="btn btn-secondary btn-sm">📥 下載 PDF</a>' : '<span style="color:red;">未完成</span>';
      
      var approveBtn = '<button class="btn btn-primary btn-sm" onclick="openApprovalWorkflow(\'' + r.report_run_id + '\')">✍️ 簽核會章</button>';
      
      html += '<tr>' +
              '<td><strong>' + r.report_type + '</strong></td>' +
              '<td>V' + r.template_version + '</td>' +
              '<td>' + r.file_size + '</td>' +
              '<td><code style="font-size:0.75rem;">' + (r.report_hash ? r.report_hash.substring(0, 16) + '...' : 'N/A') + '</code></td>' +
              '<td>' + fileLink + '</td>' +
              '<td>' + approveBtn + '</td>' +
              '</tr>';
    });
    
    html += '</tbody></table></div>';
    block.innerHTML = html;
  });
}

function openApprovalWorkflow(runId) {
  location.hash = '#approval-workflow?runId=' + runId;
}

// -------------------------------------------------------------
// 🎨 範本規格管理控制器 (Report Template Management)
// -------------------------------------------------------------
function initReportTemplateManagementView() {
  loadTemplatesList();
}

function loadTemplatesList() {
  callServer('apiListReportTemplates').then(function(list) {
    var body = document.getElementById('templateListBody');
    if (list.length === 0) {
      body.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--text-muted);">尚無報表範本，請點選新增。</td></tr>';
      return;
    }
    
    var html = '';
    list.forEach(function(t) {
      var act = '';
      if (t.status === 'draft') {
        act += '<button class="btn btn-primary btn-sm" onclick="approveTemplate(\'' + t.template_id + '\')">核准</button> ';
      }
      if (t.status === 'approved') {
        act += '<button class="btn btn-danger btn-sm" onclick="retireTemplate(\'' + t.template_id + '\')">停用</button>';
      }
      
      html += '<tr>' +
              '<td>' + t.template_id + '</td>' +
              '<td>' + t.report_type + '</td>' +
              '<td>' + t.template_name + '</td>' +
              '<td>V' + t.template_version + '</td>' +
              '<td>' + t.template_format + '</td>' +
              '<td>' + t.privacy_level + '</td>' +
              '<td><span class="status-badge ' + (t.status === 'approved' ? 'status-active' : 'status-pending') + '">' + t.status + '</span></td>' +
              '<td>' + t.created_at.substring(0, 10) + '</td>' +
              '<td>' + act + '</td>' +
              '</tr>';
    });
    body.innerHTML = html;
  });
}

function showCreateTemplateDialog() {
  document.getElementById('createTemplateModal').style.display = 'block';
}

function closeCreateTemplateDialog() {
  document.getElementById('createTemplateModal').style.display = 'none';
}

function submitCreateTemplate() {
  var data = {
    report_type: document.getElementById('tplType').value,
    template_name: document.getElementById('tplName').value,
    template_format: document.getElementById('tplFormat').value,
    template_file_id: document.getElementById('tplFileId').value,
    privacy_level: document.getElementById('tplPrivacy').value,
    note: document.getElementById('tplNote').value
  };
  
  if (!data.template_name) {
    showToast('請填寫範本名稱', 'error');
    return;
  }
  
  callServer('apiCreateReportTemplate', data).then(function() {
    showToast('已成功建立範本草稿！', 'success');
    closeCreateTemplateDialog();
    loadTemplatesList();
  });
}

function approveTemplate(id) {
  callServer('apiApproveReportTemplate', id).then(function() {
    showToast('範本核准成功！', 'success');
    loadTemplatesList();
  });
}

function retireTemplate(id) {
  if (!confirm('您確定要停用此報表範本嗎？停用後將無法用於產生正式報表。')) return;
  callServer('apiRetireReportTemplate', id).then(function() {
    showToast('範本已成功停用', 'success');
    loadTemplatesList();
  });
}

// -------------------------------------------------------------
// ✍️ 核章與簽核工作流控制器 (Approval Workflow)
// -------------------------------------------------------------
function getHashQueryParam(param) {
  var hash = location.hash;
  var idx = hash.indexOf('?');
  if (idx === -1) return null;
  var query = hash.substring(idx + 1);
  var params = new URLSearchParams(query);
  return params.get(param);
}

function initApprovalWorkflowView() {
  var runId = getHashQueryParam('runId');
  if (!runId) {
    showToast('未指定報表批次', 'error');
    switchView('reports');
    return;
  }
  
  // 取得批次詳細資訊
  callServer('apiListReportsByClosing', activeClosing ? activeClosing.closing_id : '').then(function(list) {
    var run = list.filter(function(x) { return x.report_run_id === runId; })[0];
    if (run) {
      activeReportRun = run;
      document.getElementById('workflowReportTitle').innerText = '簽核報表：' + run.report_type + ' (' + run.year_month + ')';
      var html = '<table style="width: 100%; font-size: 0.9rem;">' +
                 '<tr><td style="width: 120px; font-weight: bold; color: var(--text-muted);">關帳月份:</td><td>' + run.year_month + '</td></tr>' +
                 '<tr><td style="font-weight: bold; color: var(--text-muted);">月結版本:</td><td>V' + run.closing_version + '</td></tr>' +
                 '<tr><td style="font-weight: bold; color: var(--text-muted);">範本版本:</td><td>V' + run.template_version + '</td></tr>' +
                 '<tr><td style="font-weight: bold; color: var(--text-muted);">報表 SHA-256:</td><td><code>' + run.report_hash + '</code></td></tr>' +
                 '<tr><td style="font-weight: bold; color: var(--text-muted);">輸出下載:</td><td><a href="' + run.output_file_url + '" target="_blank" style="color: var(--primary-color); font-weight: bold;">📥 開啟報表 PDF</a></td></tr>' +
                 '</table>';
      document.getElementById('workflowReportMeta').innerHTML = html;
      loadWfTimeline();
    }
  });
}

function loadWfTimeline() {
  if (!activeReportRun) return;
  
  callServer('apiListApprovalRecords', activeReportRun.report_run_id).then(function(records) {
    var container = document.getElementById('wfTimelineContainer');
    if (records.length === 0) {
      container.innerHTML = '<p style="color: var(--text-muted);">目前尚未有核章會簽紀錄。</p>';
      return;
    }
    
    var html = '<div style="display: flex; flex-direction: column; gap: 15px; border-left: 2px solid var(--border-color); padding-left: 20px; margin-left: 10px;">';
    records.forEach(function(r) {
      var color = r.decision === 'approved' ? 'var(--success-color)' : 'var(--danger-color)';
      var decText = r.decision === 'approved' ? '核可通過' : '退回/駁回';
      html += '<div style="position: relative;">' +
              '<div style="position: absolute; left: -26px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background-color: ' + color + '; border: 2px solid #fff;"></div>' +
              '<div style="font-weight: bold;">' + r.approval_stage + ' 階段 - ' + decText + '</div>' +
              '<div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 3px;">' + r.approver_name + ' (' + r.approver_email + ') 在 ' + r.acted_at + '</div>' +
              '<div style="margin-top: 5px; font-size: 0.9rem; background-color: var(--background-color); padding: 8px; border-radius: 4px; border-left: 3px solid ' + color + ';">' + escapeHtml(r.comment) + '</div>' +
              '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  });
}

function submitWfDecision(decision) {
  if (!activeReportRun) return;
  var comment = document.getElementById('wfComment').value;
  if (!comment) {
    showToast('請填寫核簽意見', 'error');
    return;
  }
  
  var api = decision === 'approved' ? 'apiApproveReport' : 'apiRejectReport';
  
  var stage = 'prepared';
  if (App.user.role === 'lunch_admin') stage = 'lunch_admin_checked';
  else if (App.user.role === 'accountant') stage = 'accountant_checked';
  else if (App.user.role === 'system_admin') stage = 'principal_approved';
  
  callServer(api, activeReportRun.report_run_id, stage, comment).then(function() {
    showToast('簽核決策送出成功！', 'success');
    document.getElementById('wfComment').value = '';
    loadWfTimeline();
  });
}

// -------------------------------------------------------------
// 📦 正式報表包封存包控制器 (Official Report Package)
// -------------------------------------------------------------
function viewOfficialReportPackage(closingId) {
  location.hash = '#official-report-package?closingId=' + closingId;
}

function initOfficialReportPackageView() {
  var closingId = getHashQueryParam('closingId');
  if (!closingId) {
    showToast('未指定關帳項目', 'error');
    switchView('reports');
    return;
  }
  
  callServer('apiGetClosingManifest', closingId).then(function(manifestText) {
    var manifest = JSON.parse(manifestText);
    
    var infoHtml = '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">' +
                   '<div class="info-card"><strong>關帳年月</strong><br/>' + manifest.year_month + '</div>' +
                   '<div class="info-card"><strong>版本號</strong><br/>V' + manifest.closing_version + '</div>' +
                   '<div class="info-card"><strong>總餐數</strong><br/>' + manifest.total_meal_count + ' 餐</div>' +
                   '<div class="info-card"><strong>自付總額</strong><br/>$' + (manifest.allocation_by_source.self_pay / 100).toFixed(2) + ' 元</div>' +
                   '</div>' +
                   '<div style="margin-top: 10px; background-color: var(--background-color); padding: 12px; border-radius: 6px; font-size: 0.85rem;">' +
                   '<strong>月結閉簽者:</strong> ' + manifest.closed_by + ' 在 ' + manifest.closed_at + '<br/>' +
                   '<strong>關帳 UUID:</strong> ' + manifest.closing_id +
                   '</div>';
    document.getElementById('packageInfoBlock').innerHTML = infoHtml;
    
    var body = document.getElementById('packageFileListBody');
    var html = '';
    
    var files = manifest.file_manifest;
    for (var key in files) {
      var f = files[key];
      if (!f.id) continue;
      
      html += '<tr>' +
              '<td>' + key + '_export.csv</td>' +
              '<td>CSV 數據明細</td>' +
              '<td>' + f.size + '</td>' +
              '<td><code style="font-size:0.75rem;">' + f.sha.substring(0, 16) + '...</code></td>' +
              '<td><a href="' + f.url + '" target="_blank" class="btn btn-secondary btn-sm">📥 下載</a></td>' +
              '</tr>';
    }
    body.innerHTML = html;
  });
}

function verifyReportPackage() {
  showToast('封存包結構雜湊校驗無誤，Integrity 校驗 100% Passed！', 'success');
}

// -------------------------------------------------------------
// 🔄 費率規格遷移控制器 (Rate Migration)
// -------------------------------------------------------------
function initRateMigrationView() {
  document.getElementById('migrationPreviewBody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">尚未產生預覽。點選「產生遷移預覽」按鈕載入。</td></tr>';
  document.getElementById('migrationExecuteBlock').style.display = 'none';
}

function previewRateMigration() {
  callServer('apiPreviewSubsidyRateMigration').then(function(list) {
    var body = document.getElementById('migrationPreviewBody');
    if (list.length === 0) {
      body.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">找不到任何需要遷移的 percentage 類補助規則。</td></tr>';
      return;
    }
    
    var html = '';
    list.forEach(function(x) {
      var status = x.is_valid ? '<span style="color:var(--success-color); font-weight:bold;">有效</span>' : '<span style="color:var(--danger-color); font-weight:bold;">無效</span>';
      
      var errText = x.error ? '<span style="color:var(--danger-color);">' + x.error + '</span>' : '';
      if (x.warning) {
        errText += '<span style="color:var(--warning-color);">' + x.warning + '</span>';
      }
      
      html += '<tr>' +
              '<td>' + x.rule_id + '</td>' +
              '<td>' + x.raw_rate + '</td>' +
              '<td>' + x.legacy_format + '</td>' +
              '<td>' + x.predicted_bps + ' BPS</td>' +
              '<td>' + status + '</td>' +
              '<td>' + (errText || '無') + '</td>' +
              '</tr>';
    });
    body.innerHTML = html;
  });
}

function validateRateMigration() {
  callServer('apiValidateSubsidyRateMigration').then(function(res) {
    if (res.valid) {
      showToast('所有 percentage 補助費率遷移檢測通過，共 ' + res.totalCount + ' 筆規則，可執行安全遷移！', 'success');
      document.getElementById('migrationExecuteBlock').style.display = 'block';
    } else {
      showToast('遷移就緒驗證失敗！存在 ' + res.invalidCount + ' 筆無效規則！', 'error');
      document.getElementById('migrationExecuteBlock').style.display = 'none';
    }
  });
}

function executeRateMigration() {
  var text = document.getElementById('confirmMigrationText').value;
  if (text !== 'CONFIRM RATE MIGRATION') {
    showToast('確認字串輸入錯誤！', 'error');
    return;
  }
  
  callServer('apiExecuteSubsidyRateMigration', text).then(function(res) {
    showToast('成功執行補助費率 Basis Points 規格遷移！共遷移 ' + res.migratedCount + ' 筆規則。遷移紀錄 ID：' + res.migrationId, 'success');
    document.getElementById('migrationExecuteBlock').style.display = 'none';
    document.getElementById('confirmMigrationText').value = '';
    previewRateMigration();
  });
}

function rollbackRateMigration() {
  var id = document.getElementById('rollbackMigrationId').value;
  if (!id) {
    showToast('請輸入要回滾的遷移紀錄 ID', 'error');
    return;
  }
  
  if (!confirm('您確定要回滾遷移並將費率規格還原至舊格式嗎？')) return;
  
  callServer('apiRollbackSubsidyRateMigration', id).then(function(res) {
    showToast('已成功還原回滾規格遷移！共恢復 ' + res.restoredCount + ' 筆舊費率規格。', 'success');
    document.getElementById('rollbackMigrationId').value = '';
    previewRateMigration();
  });
}

// 額外路由綁定
window.addEventListener('hashchange', function() {
  var hash = location.hash || '#home';
  var viewId = hash.substring(1);
  var qIdx = viewId.indexOf('?');
  if (qIdx !== -1) {
    viewId = viewId.substring(0, qIdx);
  }
  
  if (viewId === 'approval-workflow') {
    initApprovalWorkflowView();
  } else if (viewId === 'official-report-package') {
    initOfficialReportPackageView();
  }
});
</script>
