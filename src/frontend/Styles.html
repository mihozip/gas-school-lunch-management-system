<style>
/* 學校午餐停餐、用餐統計與補助申請管理系統 - 全域 CSS */

:root {
  --primary-color: #1e3a8a; /* 經典深藍 */
  --primary-light: #3b82f6; /* 亮藍 */
  --primary-bg: #f0fdf4;
  --secondary-color: #0d9488; /* 綠色系搭配 */
  --text-main: #1f2937; /* 主要內文深灰 */
  --text-muted: #6b7280; /* 次要內文灰 */
  
  /* 狀態色系 */
  --status-healthy: #10b981; /* 綠色 */
  --status-healthy-bg: #ecfdf5;
  --status-warning: #f59e0b; /* 橘色 */
  --status-warning-bg: #fffbeb;
  --status-blocking: #ef4444; /* 紅色 */
  --status-blocking-bg: #fef2f2;
  
  /* 介面細節 */
  --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --glass-bg: rgba(255, 255, 255, 0.85);
  --border-color: #e5e7eb;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
}

body {
  background-color: #f3f4f6;
  color: var(--text-main);
  line-height: 1.5;
  font-size: 16px;
}

/* SPA 框架佈局 */
.app-container {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* 側邊導覽列 */
.sidebar {
  width: 260px;
  background-color: var(--primary-color);
  color: white;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: all 0.3s ease;
  z-index: 100;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.sidebar-title {
  font-size: 1.1rem;
  font-weight: bold;
  letter-spacing: 1px;
}

.sidebar-subtitle {
  font-size: 0.75rem;
  color: rgba(255, 255, 255, 0.7);
}

.sidebar-menu {
  flex-grow: 1;
  padding: 20px 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  color: rgba(255, 255, 255, 0.8);
  text-decoration: none;
  border-radius: 8px;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.menu-item:hover {
  background-color: rgba(255, 255, 255, 0.1);
  color: white;
}

.menu-item.active {
  background-color: var(--primary-light);
  color: white;
  font-weight: bold;
  box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
}

.menu-item.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.menu-item.disabled:hover {
  background-color: transparent;
  color: rgba(255, 255, 255, 0.8);
}

.sidebar-footer {
  padding: 15px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  background-color: rgba(0, 0, 0, 0.1);
  font-size: 0.85rem;
}

/* 主畫面區域 */
.main-content {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 頂部狀態列 */
.topbar {
  height: 60px;
  background-color: white;
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 15px;
}

.user-info {
  text-align: right;
}

.user-name {
  font-weight: bold;
  font-size: 0.9rem;
}

.user-role-badge {
  font-size: 0.75rem;
  background-color: #eff6ff;
  color: var(--primary-light);
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
}

/* 核心視圖區域 */
.view-container {
  flex-grow: 1;
  padding: 24px;
  overflow-y: auto;
  background-color: #f9fafb;
}

/* 共用卡片元件 */
.card {
  background-color: white;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  box-shadow: var(--card-shadow);
  padding: 24px;
  margin-bottom: 24px;
}

.card-title {
  font-size: 1.15rem;
  font-weight: bold;
  margin-bottom: 16px;
  color: var(--text-main);
  border-left: 4px solid var(--primary-light);
  padding-left: 10px;
}

/* 狀態面板 */
.status-panel {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.status-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background-color: #f9fafb;
}

.status-label {
  font-weight: bold;
  font-size: 0.95rem;
}

.status-value {
  font-size: 0.95rem;
}

/* 狀態標籤 */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: bold;
  text-align: center;
}

.badge-healthy {
  background-color: var(--status-healthy-bg);
  color: var(--status-healthy);
}

.badge-warning {
  background-color: var(--status-warning-bg);
  color: var(--status-warning);
}

.badge-blocking {
  background-color: var(--status-blocking-bg);
  color: var(--status-blocking);
}

/* 表單與輸入 */
.form-group {
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-label {
  font-size: 0.9rem;
  font-weight: bold;
  color: var(--text-main);
}

.form-control {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 0.95rem;
  transition: border-color 0.2s ease;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}

.form-help {
  font-size: 0.75rem;
  color: var(--text-muted);
}

/* 按鈕元件 */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  font-size: 0.95rem;
  font-weight: bold;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-primary {
  background-color: var(--primary-light);
  color: white;
}

.btn-primary:hover {
  background-color: #2563eb;
  transform: translateY(-1px);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background-color: white;
  border: 1px solid var(--border-color);
  color: var(--text-main);
}

.btn-secondary:hover {
  background-color: #f3f4f6;
}

.btn-disabled {
  opacity: 0.5;
  cursor: not-allowed !important;
  transform: none !important;
}

/* 列表與警示 */
.alert-box {
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
  display: flex;
  gap: 12px;
  border: 1px solid transparent;
}

.alert-blocking {
  background-color: var(--status-blocking-bg);
  border-color: #fecaca;
  color: #991b1b;
}

.alert-warning {
  background-color: var(--status-warning-bg);
  border-color: #fde68a;
  color: #92400e;
}

.alert-healthy {
  background-color: var(--status-healthy-bg);
  border-color: #a7f3d0;
  color: #065f46;
}

/* 讀取動畫 */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(255, 255, 255, 0.7);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.loading-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid rgba(59, 130, 246, 0.1);
  border-top-color: var(--primary-light);
  border-radius: 50%;
  animation: spin 1s infinite linear;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* 訊息提示 (Toast) */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  min-width: 250px;
  background-color: #1f2937;
  color: white;
  padding: 12px 20px;
  border-radius: 8px;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  animation: slideIn 0.3s ease forwards;
}

@keyframes slideIn {
  0% { transform: translateY(100px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

/* RWD 手機版支援 */
@media (max-width: 768px) {
  .app-container {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    height: auto;
  }
  .sidebar-menu {
    flex-direction: row;
    padding: 10px;
    overflow-x: auto;
  }
  .menu-item {
    padding: 8px 12px;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .sidebar-footer {
    display: none;
  }
}

/* 對話框 (Modal) 核心樣式 */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(17, 24, 39, 0.6); /* 半透明遮罩 */
  backdrop-filter: blur(4px); /* 背景模糊防分心 */
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.modal-content {
  background-color: white;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  width: 90%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  animation: modalFadeIn 0.25s ease-out;
}

.modal-close {
  position: absolute;
  top: 16px;
  right: 20px;
  font-size: 1.8rem;
  font-weight: bold;
  color: var(--text-muted);
  cursor: pointer;
  line-height: 1;
  transition: color 0.15s ease;
}

.modal-close:hover {
  color: var(--text-main);
}

@keyframes modalFadeIn {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 網格篩選與表單元件美化 */
input[type="text"], input[type="number"], input[type="email"], input[type="date"], select, textarea {
  padding: 8px 12px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  background-color: white;
  color: var(--text-main);
  outline: none;
  font-size: 0.92rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

input:disabled, select:disabled, textarea:disabled {
  background-color: #f3f4f6;
  color: var(--text-muted);
  cursor: not-allowed;
}

.table th {
  position: sticky;
  top: 0;
  background-color: #f9fafb;
  border-bottom: 2px solid var(--border-color);
  font-weight: bold;
  color: var(--text-main);
}
</style>
